<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<style>
  [data-hero3d] { position: relative; width: 100%; height: clamp(280px, 42vw, 560px); overflow: hidden; background: linear-gradient(180deg, #ffffff 0%, #f2f2f2 100%); }
  [data-hero3d-visual] { position: absolute; inset: 0; width: 100%; height: 100%; }
  [data-hero3d] canvas { display: block; width: 100%; height: 100%; }
  [data-hero3d-fallback] { position: absolute; inset: 0; width: 100%; height: 100%; }
  [data-hero3d-fallback] rect { transition: transform 1.1s cubic-bezier(0.16, 1, 0.3, 1) var(--fd, 0ms); }

  /* Cinematic intro caption — fades/slides in once the plank assembly has
     settled, using the same fade + rise language as the site's
     scroll-reveal system, just time-triggered instead of scroll-triggered.
     Pinned to the top-left corner, capped narrow, so it never overlaps or
     crowds the pallet sitting center-frame. */
  [data-hero3d-caption] {
    position: absolute; left: clamp(18px, 3.4vw, 40px); top: clamp(18px, 3.4vw, 40px);
    max-width: min(320px, 42%);
    opacity: 0; transform: translateY(14px);
    transition: opacity 0.75s cubic-bezier(0.2,0.7,0.2,1), transform 0.75s cubic-bezier(0.2,0.7,0.2,1);
    pointer-events: none;
  }
  [data-hero3d-caption].is-in { opacity: 1; transform: none; }
  [data-hero3d-caption] strong {
    display: block; font-family: var(--font-heading); font-weight: 600;
    font-size: clamp(19px, 2.2vw, 25px); letter-spacing: 0.02em; text-transform: uppercase;
    line-height: 1.1; color: var(--color-text);
  }
  [data-hero3d-caption] span {
    display: block; margin-top: 8px; font-size: clamp(13px, 1.3vw, 15px); line-height: 1.4;
    color: color-mix(in srgb, var(--color-text) 70%, transparent);
  }
  @media (max-width: 640px) {
    [data-hero3d-caption] { max-width: 62%; }
    [data-hero3d-caption] strong { font-size: 16px; }
    [data-hero3d-caption] span { font-size: 12px; margin-top: 5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    [data-hero3d-fallback] rect { transition: none; }
    [data-hero3d-caption] { transition: none; }
  }
</style>
</helmet>
<div data-hero3d>
  <div data-hero3d-visual aria-hidden="true">
    <sc-if value="{{ showThree }}" hint-placeholder-val="{{ false }}">
      <canvas ref="{{ canvasRef }}"></canvas>
    </sc-if>
    <sc-if value="{{ showFallback }}" hint-placeholder-val="{{ false }}">
      <svg data-hero3d-fallback viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet">
        <sc-for list="{{ planks }}" as="p" hint-placeholder-count="12">
          <rect x="{{ p.x }}" y="{{ p.y }}" width="{{ p.w }}" height="{{ p.h }}" fill="{{ p.fill }}" style="{{ p.style }}"></rect>
        </sc-for>
      </svg>
    </sc-if>
  </div>
  <div data-hero3d-caption class="{{ captionClass }}">
    <strong>Al Madhi Carpentry</strong>
    <span>Built for shipping, warehousing and export across the UAE.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:420}}">
/* Cinematic plank-assembly intro for the homepage hero. Two independent
   render paths, chosen once and never mixed mid-session:
   - three: a WebGL scene where 12 light-pine planks (procedural wood-grain
     texture) fly in from scattered start poses and settle into a pallet
     (3 runners + 9 deck boards), shot from a 3/4 catalogue angle on a
     plain white/light-grey studio backdrop with soft, even, neutral
     lighting and a slow camera dolly-in.
   - fallback: the same 12-plank layout as flat SVG rects, animated purely
     with CSS transform/opacity (compositor-only, no canvas) for phones
     that can't hold a smooth WebGL frame rate, for browsers without WebGL,
     and for prefers-reduced-motion (shown already assembled, no motion).
   The three path is watched for its own first second of real frame times;
   if it can't hold ~24fps on THIS device, it tears itself down and hands
   off to fallback rather than limping through a janky animation. */
class Component extends DCLogic {
  state = { mode: 'pending', captionIn: false };

  componentDidMount() {
    this._reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (this._reduced || !this._hasWebGL()) {
      this.setState({ mode: 'fallback', captionIn: true });
      return;
    }
    this.setState({ mode: 'three' }, () => this._initThree());
    // One timer covers both render paths: the three.js assembly (plank
    // tumble-in + camera dolly) settles at ~3s, the CSS fallback settles
    // faster (~1.9s) — either way this reads as a deliberate cinematic
    // beat after the pallet finishes assembling, not a mistimed cue.
    this._captionTimer = setTimeout(() => {
      this._captionTimer = null;
      if (!this._unmounted) this.setState({ captionIn: true });
    }, 3500);
  }

  componentWillUnmount() {
    this._unmounted = true;
    if (this._captionTimer) { clearTimeout(this._captionTimer); this._captionTimer = null; }
    this._teardownThree();
  }

  _hasWebGL() {
    try {
      const c = document.createElement('canvas');
      return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
    } catch (e) {
      return false;
    }
  }

  /* Three.js loads from a CDN <script> in this component's own <helmet> —
     it may still be mid-flight when componentDidMount fires. Poll rather
     than trust load order; give up after ~8s and hand off to the CSS
     fallback so a slow/blocked CDN never leaves a blank hero band. */
  _initThree() {
    if (!this.canvas || !this.canvas.isConnected) return;
    if (window.THREE) { this._startThree(); return; }
    const startedAt = Date.now();
    this._waitTimer = setInterval(() => {
      if (window.THREE) {
        clearInterval(this._waitTimer);
        this._startThree();
      } else if (Date.now() - startedAt > 8000) {
        clearInterval(this._waitTimer);
        this._fallBack();
      }
    }, 80);
  }

  _fallBack() {
    this._teardownThree();
    if (this.state.mode !== 'fallback') this.setState({ mode: 'fallback' });
  }

  _teardownThree() {
    if (this._raf) cancelAnimationFrame(this._raf);
    this._raf = null;
    if (this._waitTimer) clearInterval(this._waitTimer);
    this._waitTimer = null;
    if (this._ro) { this._ro.disconnect(); this._ro = null; }
    if (this._disposables) {
      this._disposables.forEach((d) => { try { d.dispose(); } catch (e) {} });
      this._disposables = null;
    }
    if (this._renderer) {
      try { this._renderer.dispose(); this._renderer.forceContextLoss && this._renderer.forceContextLoss(); } catch (e) {}
      this._renderer = null;
    }
    this._scene = null;
    this._camera = null;
  }

  _startThree() {
    const THREE = window.THREE;
    const canvas = this.canvas;
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
    } catch (e) {
      this._fallBack();
      return;
    }
    this._renderer = renderer;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    this._scene = scene;
    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
    this._camera = camera;

    // Soft, even studio lighting — neutral white throughout (no amber/tan
    // cast), a broad ambient fill so the shadow stays gentle, and a single
    // key light for one soft shadow rather than hard directional contrast.
    const hemi = new THREE.HemisphereLight(0xffffff, 0xe4e4e4, 0.9);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xffffff, 0.85);
    key.position.set(5, 9, 7);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.left = -8; key.shadow.camera.right = 8;
    key.shadow.camera.top = 8; key.shadow.camera.bottom = -8;
    key.shadow.camera.updateProjectionMatrix();
    key.shadow.radius = 4;
    key.shadow.bias = -0.0015;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 0.4);
    fill.position.set(-6, 5, -4);
    scene.add(fill);

    // Seamless studio backdrop: the CSS gradient behind the (alpha:true)
    // canvas IS the white-to-light-grey sweep, so the ground itself must
    // never paint a visible color or edge — a ShadowMaterial renders
    // nothing but the soft shadow it catches, which is what a real floor
    // in a product shot would show against seamless paper.
    const groundGeo = new THREE.PlaneGeometry(60, 60);
    const groundMat = new THREE.ShadowMaterial({ opacity: 0.22 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.72;
    ground.receiveShadow = true;
    scene.add(ground);
    this._disposables = [groundGeo, groundMat];

    // Light natural pine, not flat dark-brown — a small procedural wood-grain
    // texture (canvas-drawn, no external image) gives the matte boards real
    // grain/streaking instead of a shiny plastic look. Cloned per plank type
    // so the runners and deck boards can carry different UV repeats while
    // sharing one GPU upload.
    const woodTex = this._makeWoodTexture(THREE);
    const runnerTex = woodTex.clone();
    runnerTex.needsUpdate = true;
    runnerTex.repeat.set(1, 5);
    const deckTex = woodTex.clone();
    deckTex.needsUpdate = true;
    deckTex.repeat.set(4, 1);
    this._disposables.push(woodTex, runnerTex, deckTex);

    // Layout: 3 long runners (skids) on the ground, 9 deck boards laid
    // across them — a simplified, stylised pallet, not an engineering
    // drawing, sized to read clearly in a shallow hero band.
    const planks = [];
    const runnerGeo = new THREE.BoxGeometry(0.55, 0.5, 7.6);
    this._disposables.push(runnerGeo);
    [-3.1, 0, 3.1].forEach((x) => {
      const mat = new THREE.MeshStandardMaterial({ map: runnerTex, color: 0xe3d5b0, roughness: 0.8, transparent: true, opacity: 0 });
      this._disposables.push(mat);
      const m = new THREE.Mesh(runnerGeo, mat);
      m.castShadow = true; m.receiveShadow = true;
      planks.push({ mesh: m, finalPos: new THREE.Vector3(x, -0.47, 0), finalRot: new THREE.Euler(0, 0, 0) });
    });
    const deckGeo = new THREE.BoxGeometry(7.4, 0.34, 0.62);
    this._disposables.push(deckGeo);
    for (let i = 0; i < 9; i++) {
      const z = -3.6 + i * 0.9;
      const mat = new THREE.MeshStandardMaterial({ map: deckTex, color: 0xede0c5, roughness: 0.78, transparent: true, opacity: 0 });
      this._disposables.push(mat);
      const m = new THREE.Mesh(deckGeo, mat);
      m.castShadow = true; m.receiveShadow = true;
      planks.push({ mesh: m, finalPos: new THREE.Vector3(0, -0.05, z), finalRot: new THREE.Euler(0, 0, 0) });
    }

    // Scattered starting pose per plank: offset outward from its final slot
    // and tumbled, so each piece visibly flies in and rights itself.
    planks.forEach((p, i) => {
      const angle = (i / planks.length) * Math.PI * 2;
      const spread = 5.5 + (i % 3) * 1.4;
      p.startPos = new THREE.Vector3(
        p.finalPos.x + Math.cos(angle) * spread,
        p.finalPos.y + 3.2 + (i % 4) * 0.9,
        p.finalPos.z + Math.sin(angle) * spread
      );
      p.startRot = new THREE.Euler(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
      p.mesh.position.copy(p.startPos);
      p.mesh.rotation.copy(p.startRot);
      // A base per-index cascade (so runners still broadly lead deck
      // boards) plus real jitter on top — identical spacing read as a
      // metronome, not a choreographed assembly.
      p.delay = i * 55 + Math.random() * 130;
      scene.add(p.mesh);
    });
    this._planks = planks;

    // 3/4 catalogue angle — up and to the side, so both the top deck and
    // the side gaps between the runners read clearly, like a product shot.
    // camStart sits further back AND rotated ~18° around the same target,
    // so lerping to camEnd traces a combined push-in + slow orbit instead
    // of a straight-line dolly that reads as static.
    this._camEnd = new THREE.Vector3(8.5, 3.4, 8.0);
    const endRadius = Math.hypot(this._camEnd.x, this._camEnd.z);
    const endAngle = Math.atan2(this._camEnd.z, this._camEnd.x);
    const startAngle = endAngle + (18 * Math.PI) / 180;
    const startRadius = endRadius * 1.6;
    this._camStart = new THREE.Vector3(
      Math.cos(startAngle) * startRadius,
      this._camEnd.y * 1.9,
      Math.sin(startAngle) * startRadius
    );
    this._camLookAt = new THREE.Vector3(0, -0.15, 0);
    camera.position.copy(this._camStart);
    camera.lookAt(this._camLookAt);

    this._ro = new ResizeObserver(() => this._resize());
    this._ro.observe(canvas.parentElement);
    this._resize();

    const DURATION = 2400;
    const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
    // Overshoot-and-settle for the planks themselves: each piece slides
    // slightly past its final slot, then eases back — the "choreographed,
    // not mechanical" landing. Camera stays on the plain cubic above;
    // overshoot on camera motion reads as nauseating, not premium.
    const easeOutBack = (t) => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    };
    const start = performance.now();
    let frames = 0;
    let sumDelta = 0;
    let lastT = start;
    let watchdogDone = false;
    const WATCH_WINDOW = 900;

    const tick = (now) => {
      const delta = now - lastT;
      lastT = now;
      frames++;
      if (!watchdogDone) {
        sumDelta += delta;
        if (now - start >= WATCH_WINDOW) {
          watchdogDone = true;
          const avgFps = 1000 / (sumDelta / frames);
          if (avgFps < 24) { this._fallBack(); return; }
        }
      }

      // Camera keeps easing (and orbiting) for slightly longer than the
      // planks' own worst-case settle time (DURATION + up to ~185ms of
      // jitter), so it's still visibly moving as the last piece lands
      // instead of stopping early and reading as static for the tail end.
      const camT = Math.min(1, (now - start) / (DURATION + 900));
      camera.position.lerpVectors(this._camStart, this._camEnd, easeOutCubic(camT));
      camera.lookAt(this._camLookAt);

      planks.forEach((p) => {
        const local = now - start - p.delay;
        const t = Math.max(0, Math.min(1, local / DURATION));
        const e = easeOutBack(t);
        p.mesh.position.lerpVectors(p.startPos, p.finalPos, e);
        p.mesh.rotation.x = p.startRot.x + (p.finalRot.x - p.startRot.x) * e;
        p.mesh.rotation.y = p.startRot.y + (p.finalRot.y - p.startRot.y) * e;
        p.mesh.rotation.z = p.startRot.z + (p.finalRot.z - p.startRot.z) * e;
        // Cheap stand-in for motion blur/DOF: each plank materializes in
        // (opacity 0->1) well before it lands, rather than being a fully
        // solid object tumbling through the air — full post-processing
        // blur would cost an extra render pass per frame, which risks the
        // fps budget this component's own watchdog exists to protect.
        p.mesh.material.opacity = Math.min(1, t / 0.35);
      });

      // Once every plank has eased to e=1, this naturally holds on an
      // almost-still frame — a constantly-spinning hero reads as a loading
      // spinner, not a premium product shot.
      renderer.render(scene, camera);
      this._raf = requestAnimationFrame(tick);
    };
    this._raf = requestAnimationFrame(tick);
  }

  /* Procedural light-pine grain — drawn on a canvas so the boards read as
     real wood (streaks, a couple of knots) rather than flat plastic, with
     no external image asset. Cheap: one small canvas, cloned per plank
     type for independent UV repeat. */
  _makeWoodTexture(THREE) {
    const w = 256, h = 128;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    // Grayscale grain, not colored: MeshStandardMaterial multiplies this
    // texture by `color`, so a white base passes the pine hex through
    // unchanged and only the darker (grey) streaks/knots shade it down —
    // no separate tan/brown pigment baked into the map to fight the color.
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    const streaks = 14;
    for (let i = 0; i < streaks; i++) {
      const yBase = (i + 0.5) * (h / streaks);
      const amp = 3 + Math.random() * 4;
      const freq = 0.02 + Math.random() * 0.015;
      const phase = Math.random() * Math.PI * 2;
      ctx.beginPath();
      for (let x = 0; x <= w; x += 8) {
        const y = yBase + Math.sin(x * freq + phase) * amp;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = 'rgba(0, 0, 0,' + (0.06 + Math.random() * 0.1).toFixed(2) + ')';
      ctx.lineWidth = 1 + Math.random() * 2;
      ctx.stroke();
    }
    const knots = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < knots; i++) {
      const kx = 20 + Math.random() * (w - 40);
      const ky = 15 + Math.random() * (h - 30);
      const kr = 4 + Math.random() * 4;
      const grad = ctx.createRadialGradient(kx, ky, 0, kx, ky, kr * 2.2);
      grad.addColorStop(0, 'rgba(0, 0, 0, 0.4)');
      grad.addColorStop(0.5, 'rgba(0, 0, 0, 0.16)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(kx, ky, kr * 2.2, kr * 1.4, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  _resize() {
    if (!this._renderer || !this.canvas) return;
    const el = this.canvas.parentElement;
    const w = el.clientWidth || 1;
    const h = el.clientHeight || 1;
    this._renderer.setSize(w, h, false);
    this._camera.aspect = w / h;
    this._camera.updateProjectionMatrix();
  }

  /* Static plank layout for the CSS/SVG fallback — same 3-runner /
     9-deck-board pallet, expressed as flat rects so it costs nothing but a
     handful of compositor-only transform transitions. */
  _fallbackPlanks() {
    const reduced = this._reduced;
    const items = [];
    const runners = [60, 190, 320];
    runners.forEach((x, i) => {
      items.push({
        x, y: 150, w: 22, h: 90, fill: '#e3d5b0',
        style: reduced
          ? 'transform: translate(0,0) rotate(0deg);'
          : 'transform: translate(' + (i % 2 ? 90 : -90) + 'px, -60px) rotate(' + (i % 2 ? 24 : -24) + 'deg); --fd: ' + (i * 90) + 'ms;',
      });
    });
    for (let i = 0; i < 9; i++) {
      const y = 60 + i * 10;
      items.push({
        x: 40, y, w: 320, h: 7, fill: '#ede0c5',
        style: reduced
          ? 'transform: translate(0,0) rotate(0deg);'
          : 'transform: translate(' + (i % 2 ? 140 : -140) + 'px, ' + (-40 - i * 6) + 'px) rotate(' + (i % 2 ? -14 : 14) + 'deg); --fd: ' + (240 + i * 70) + 'ms;',
      });
    }
    return items;
  }

  componentDidUpdate(prevProps, prevState) {
    // Flip the fallback rects to their assembled transform one tick after
    // mount, so the browser paints the scattered start pose first and the
    // CSS transition actually has something to animate from.
    if (this.state.mode === 'fallback' && !this._fallbackArmed && !this._reduced) {
      this._fallbackArmed = true;
      requestAnimationFrame(() => requestAnimationFrame(() => { if (!this._unmounted) this.forceUpdate(); }));
    }
  }

  renderVals() {
    return {
      showThree: this.state.mode === 'three',
      showFallback: this.state.mode === 'fallback',
      canvasRef: (el) => { this.canvas = el; },
      planks: this.state.mode === 'fallback' ? this._assembledOrScattered() : [],
      captionClass: this.state.captionIn ? 'is-in' : '',
    };
  }

  _assembledOrScattered() {
    if (!this._fallbackData) this._fallbackData = this._fallbackPlanks();
    if (this._reduced || this._fallbackArmed) {
      return this._fallbackData.map((p) => Object.assign({}, p, { style: 'transform: translate(0,0) rotate(0deg);' }));
    }
    return this._fallbackData;
  }
}
</script>
</body>
</html>
